<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Data Entry App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>

</head>


<body>

    <div class="container">

        <h1>Customer Information</h1>

        <form>

            <label>Name</label>

            <input
                type="text"
                placeholder="Enter your name"
            >


            <label>Email</label>

            <input
                type="email"
                placeholder="Enter your email"
            >


            <label>Phone</label>

            <input
                type="text"
                placeholder="Enter your phone"
            >


            <label>City</label>

            <input
                type="text"
                placeholder="Enter your city"
            >


            <button type="submit">
                Save Information
            </button>

        </form>

    </div>

</body>

</html>
